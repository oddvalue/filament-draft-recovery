name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.3]
        filament: ['4.*', '5.*']
        # Filament 4 and 5 both support Laravel 11-13; they differ on Livewire
        # (4 needs ^3.5, 5 needs ^4.1), so each major is paired with the
        # Laravel release it most commonly ships against.
        include:
          - filament: '4.*'
            laravel: 12.*
            testbench: 10.*
          - filament: '5.*'
            laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - F${{ matrix.filament }} - L${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci --coverage --min=100 --coverage-cobertura coverage.xml

      - name: Upload coverage badge
        uses: gaelgirodon/ci-badges-action@07a65145ff9feb271f426865f940977a94578ad4 # v1.5.0
        # Non-fatal so a missing GIST_TOKEN secret never fails the test run.
        continue-on-error: true
        # Pinned to a single matrix cell so concurrent jobs never race to
        # write the same gist.
        if: github.ref == 'refs/heads/main' && matrix.php == 8.4 && matrix.filament == '5.*'
        with:
          gist-id: 9dd8e508cb2433728d42a258193770eb
          token: ${{ secrets.GIST_TOKEN }}
