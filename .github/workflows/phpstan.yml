name: phpstan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.3]
        filament: ['4.*', '5.*']
        stability: [prefer-stable]
        # Mirrors the pairings in tests.yml: both Filament majors support
        # Laravel 11-13, so each is analysed against the release it commonly
        # ships against.
        include:
          - filament: '4.*'
            laravel: 12.*
            testbench: 10.*
          - filament: '5.*'
            laravel: 13.*
            testbench: 11.*
    name: P${{ matrix.php }} - F${{ matrix.filament }} - L${{ matrix.laravel }} - ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-f${{ matrix.filament }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-f${{ matrix.filament }}-${{ matrix.laravel }}-
            composer-${{ matrix.php }}-f${{ matrix.filament }}-
            composer-${{ matrix.php }}-

      # Must match `tmpDir` in phpstan.neon.dist, or the result cache is
      # written somewhere this step never restores.
      - name: Cache PHPStan result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/phpstan
          key: phpstan-${{ matrix.php }}-f${{ matrix.filament }}-${{ matrix.laravel }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ matrix.php }}-f${{ matrix.filament }}-${{ matrix.laravel }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
